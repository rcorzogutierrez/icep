name: Deploy to Firebase Hosting

# Runs only after CI succeeds on a push to master -- never deploys code
# that didn't pass typecheck/lint/test/build. `npm run deploy` (used here
# too) only pushes Hosting, same as its documented local/manual meaning in
# CLAUDE.md -- so firestore.rules/storage.rules/firestore.indexes.json get
# their own explicit `firebase deploy` step below, unconditionally on every
# run (idempotent if nothing changed), instead of relying on someone
# remembering to run it by hand after a rules PR merges.
on:
  workflow_run:
    workflows: ['CI']
    types: [completed]
    branches: [master]

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm install -g npm@11.12.0
      - run: npm ci

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ICEP }}

      - run: npm run deploy

      # Firestore and Storage deploy are split into separate `firebase
      # deploy` invocations on purpose: the CLI groups all `--only` targets
      # into one deploy and aborts the WHOLE thing on the first target's
      # pre-check failure, so bundling them meant a Storage-only permission
      # problem (service account missing access to check
      # firebasestorage.googleapis.com's enablement) silently also skipped
      # the Firestore rules/indexes deploy. KNOWN ISSUE as of 2026-11: the
      # service account (FIREBASE_SERVICE_ACCOUNT_ICEP) currently lacks the
      # `serviceusage.services.get` permission on the icep-44c27 GCP project
      # itself, so BOTH steps below fail their enablement pre-check with
      # "403 Permission denied to get service [...]" -- this needs a real
      # IAM grant (e.g. Service Usage Consumer/Viewer) on that service
      # account in Google Cloud Console, which nothing in this repo can fix.
      # `continue-on-error` is on both steps for that reason: a step failing
      # without it skips every later step in the same job, so without this
      # a Firestore pre-check failure would also hide whether Storage's
      # independently succeeds (and vice versa) once the permission is
      # granted and only one of the two still has a real problem.
      - name: Deploy Firestore rules and indexes
        continue-on-error: true
        run: npx firebase deploy --only firestore:rules,firestore:indexes

      - name: Deploy Storage rules
        continue-on-error: true
        run: npx firebase deploy --only storage:rules
