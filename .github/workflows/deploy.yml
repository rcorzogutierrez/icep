name: Deploy to Firebase Hosting

# Runs only after CI succeeds on a push to master -- never deploys code
# that didn't pass typecheck/lint/test/build. `npm run deploy` (used here
# too) only pushes Hosting, same as its documented local/manual meaning in
# CLAUDE.md -- so firestore.rules/storage.rules/firestore.indexes.json get
# their own explicit `firebase deploy` step below, unconditionally on every
# run (idempotent if nothing changed), instead of relying on someone
# remembering to run it by hand after a rules PR merges.
on:
  workflow_run:
    workflows: ['CI']
    types: [completed]
    branches: [master]

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm install -g npm@11.12.0
      - run: npm ci

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ICEP }}

      - run: npm run deploy

      - name: Deploy Firestore/Storage rules and indexes
        run: npx firebase deploy --only firestore:rules,firestore:indexes,storage:rules
