<div
  class="pointer-events-none fixed inset-x-0 bottom-0 z-50 flex flex-col items-center gap-2 p-4 sm:items-end"
  role="region"
  aria-live="polite"
  [attr.aria-label]="i18n.t('common', 'notifications')"
>
  @for (toast of toastService.toasts(); track toast.id) {
    <div
      class="pointer-events-auto flex w-full max-w-sm items-start gap-3 rounded-lg border bg-surface p-3 shadow-lg"
      [class.border-status-active]="toast.variant === 'success'"
      [class.border-status-expired]="toast.variant === 'error'"
      [class.border-border]="toast.variant === 'info'"
    >
      <span
        class="mt-0.5 shrink-0"
        [class.text-status-active]="toast.variant === 'success'"
        [class.text-status-expired]="toast.variant === 'error'"
        [class.text-brand-600]="toast.variant === 'info'"
      >
        @switch (toast.variant) {
          @case ('success') {
            <svg lucideCircleCheck [size]="18" aria-hidden="true"></svg>
          }
          @case ('error') {
            <svg lucideCircleAlert [size]="18" aria-hidden="true"></svg>
          }
          @default {
            <svg lucideInfo [size]="18" aria-hidden="true"></svg>
          }
        }
      </span>

      <p class="flex-1 text-sm text-text">{{ toast.message }}</p>

      <button
        type="button"
        class="shrink-0 text-text-muted hover:text-text"
        [attr.aria-label]="i18n.t('common', 'close')"
        (click)="toastService.dismiss(toast.id)"
      >
        <svg lucideX [size]="16" aria-hidden="true"></svg>
      </button>
    </div>
  }
</div>
