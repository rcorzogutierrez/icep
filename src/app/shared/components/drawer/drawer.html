@if (open()) {
  <!--
    El click en el backdrop es solo una conveniencia extra para mouse: el
    teclado ya puede cerrar el drawer con Escape (ver Drawer::onEscape) y
    con el botón ✕ (sí focuseable) — por eso este div no necesita ser
    interactivo/focuseable él mismo.
  -->
  <!-- eslint-disable-next-line @angular-eslint/template/click-events-have-key-events, @angular-eslint/template/interactive-supports-focus -->
  <div class="fixed inset-0 z-50 flex justify-end bg-black/40" (click)="onBackdropClick($event)">
    <div class="flex h-full w-full max-w-md flex-col rounded-l-2xl bg-surface shadow-xl">
      <div class="flex items-center gap-4 border-b border-border px-6 py-5">
        @if (avatarInitial(); as initial) {
          <span
            class="flex size-12 shrink-0 items-center justify-center rounded-full bg-brand-100 text-lg font-semibold text-brand-700 ring-4 ring-brand-50"
          >
            {{ initial }}
          </span>
        }
        <div class="min-w-0 flex-1">
          @if (title(); as titleText) {
            <h2 class="truncate text-base font-semibold text-text">{{ titleText }}</h2>
          }
          @if (subtitle(); as subtitleText) {
            <p class="truncate text-sm text-text-muted">{{ subtitleText }}</p>
          }
        </div>
        <button
          type="button"
          class="shrink-0 text-text-muted hover:text-text"
          [attr.aria-label]="i18n.t('common', 'close')"
          (click)="close()"
        >
          <svg lucideX [size]="18" aria-hidden="true"></svg>
        </button>
      </div>
      <div class="flex-1 overflow-y-auto p-6">
        <ng-content />
      </div>
    </div>
  </div>
}
