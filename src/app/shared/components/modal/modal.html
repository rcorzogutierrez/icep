@if (open()) {
  <!--
    El click en el backdrop es solo una conveniencia extra para mouse: el
    teclado ya puede cerrar el modal con Escape (ver Modal::onEscape) y con
    el botón ✕ (sí focuseable) — por eso este div no necesita ser
    interactivo/focuseable él mismo.
  -->
  <!-- eslint-disable-next-line @angular-eslint/template/click-events-have-key-events, @angular-eslint/template/interactive-supports-focus -->
  <div
    class="fixed inset-0 z-50 flex items-center justify-center bg-black/40 p-4"
    (click)="onBackdropClick($event)"
  >
    <div class="flex max-h-[90vh] w-full max-w-2xl flex-col rounded-lg bg-surface shadow-xl">
      <div class="flex items-center justify-between gap-4 border-b border-border px-4 py-3">
        @if (title(); as titleText) {
          <h2 class="text-sm font-semibold text-text">{{ titleText }}</h2>
        }
        <button
          type="button"
          class="ml-auto text-text-muted hover:text-text"
          [attr.aria-label]="i18n.t('common', 'close')"
          (click)="close()"
        >
          <svg lucideX [size]="18" aria-hidden="true"></svg>
        </button>
      </div>
      <div class="overflow-y-auto p-4">
        <ng-content />
      </div>
    </div>
  </div>
}
