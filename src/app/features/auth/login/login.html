<main class="flex min-h-dvh items-center justify-center bg-slate-50 px-6">
  <div class="w-full max-w-sm rounded-lg border border-border bg-surface p-8 text-center shadow-sm">
    <h1 class="text-2xl font-semibold text-brand-700">icep</h1>
    <p class="mt-2 text-sm text-text-muted">
      Iniciá sesión con tu cuenta de Google. Si es tu primera vez, tu cuenta se crea automáticamente
      y queda pendiente de aprobación por un administrador.
    </p>

    <div class="mt-6 flex justify-center">
      <app-button size="lg" [loading]="signingIn()" (pressed)="onSignIn()">
        <span class="flex items-center justify-center gap-2">
          @if (!signingIn()) {
            <svg viewBox="0 0 48 48" width="18" height="18" aria-hidden="true">
              <path
                fill="#FFC107"
                d="M43.611,20.083H42V20H24v8h11.303c-1.649,4.657-6.08,8-11.303,8c-6.627,0-12-5.373-12-12 c0-6.627,5.373-12,12-12c3.059,0,5.842,1.154,7.961,3.039l5.657-5.657C34.046,6.053,29.268,4,24,4C12.955,4,4,12.955,4,24 c0,11.045,8.955,20,20,20c11.045,0,20-8.955,20-20C44,22.659,43.862,21.35,43.611,20.083z"
              />
              <path
                fill="#FF3D00"
                d="M6.306,14.691l6.571,4.819C14.655,15.108,18.961,12,24,12c3.059,0,5.842,1.154,7.961,3.039 l5.657-5.657C34.046,6.053,29.268,4,24,4C16.318,4,9.656,8.337,6.306,14.691z"
              />
              <path
                fill="#4CAF50"
                d="M24,44c5.166,0,9.86-1.977,13.409-5.192l-6.19-5.238C29.211,35.091,26.715,36,24,36 c-5.202,0-9.619-3.317-11.283-7.946l-6.522,5.025C9.505,39.556,16.227,44,24,44z"
              />
              <path
                fill="#1976D2"
                d="M43.611,20.083H42V20H24v8h11.303c-0.792,2.237-2.231,4.166-4.087,5.571 c0.001-0.001,0.002-0.001,0.003-0.002l6.19,5.238C36.971,39.205,44,34,44,24 C44,22.659,43.862,21.35,43.611,20.083z"
              />
            </svg>
          }
          Continuar con Google
        </span>
      </app-button>
    </div>

    @if (errorMessage(); as message) {
      <p class="mt-4 text-sm text-status-expired">{{ message }}</p>
    }
  </div>
</main>
